[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eduguard-backend"
version = "0.1.0"
description = "EduGuard multi-tenant school backend with pretrained inference"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "PyJWT>=2.10,<3", "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "scikit-learn==1.6.1", "numpy>=1.26,<3", "pandas>=2.2,<3", "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv312", ".python", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
